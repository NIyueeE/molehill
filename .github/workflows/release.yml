name: Release

# Tag-driven releases only (AGENTS.md §5): pushing a `v*` tag is the single
# release trigger. The tag version must equal Cargo.toml's version and a
# dated `## [x.y.z]` section must exist in CHANGELOG.md — the changelog is
# the single source of release notes. A missing section fails the release.
# For verifying a commit without releasing, use test-build.yml instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - name: Verify version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Mismatch: Cargo.toml version=$CARGO_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG section exists (single source of release notes)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Add it (Keep a Changelog format) before tagging."
            exit 1
          fi

      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: molehill
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: molehill
            cross: false
            # Full rustls feature set: static musl binary, no OpenSSL.
            # Used as the linux/amd64 container image artifact.
            features: server,client,rustls,noise,websocket-rustls,hot-reload,multiplex
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            exe: molehill
            cross: true
            # Same feature set as x86_64 musl so the linux/arm64 container
            # image artifact is feature-consistent with linux/amd64.
            features: server,client,rustls,noise,websocket-rustls,hot-reload,multiplex
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
            exe: molehill
            cross: true
            features: embedded
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            exe: molehill
            cross: true
            features: embedded
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            exe: molehill
            cross: true
            features: embedded

          - os: macos-latest
            target: x86_64-apple-darwin
            exe: molehill
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            exe: molehill
            cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: molehill.exe
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install OpenSSL
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install pkg-config libssl-dev
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install musl-tools
      - name: Install OpenSSL
        if: matrix.os == 'macos-latest'
        run: brew install openssl@3

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose ${{ matrix.features && format('--no-default-features --features {0}', matrix.features) || '' }}
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--no-default-features --features {0}', matrix.features) || '' }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose ${{ matrix.features && format('--no-default-features --features {0}', matrix.features) || '' }}
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} ${{ matrix.features && format('--no-default-features --features {0}', matrix.features) || '' }}

      - name: Run UPX
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest'
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          version: v4.0.2
          files: target/${{ matrix.target }}/release/${{ matrix.exe }}
          args: -q --best --lzma

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="molehill-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name/"
          cp LICENSE README.md README.zh.md "$name/" 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path '$name' -DestinationPath '${name}.zip'"
          else
            tar czf "${name}.tar.gz" "$name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            molehill-*.tar.gz
            molehill-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS 2>/dev/null || true

      # Releases are created as drafts; publish after a quick look.
      # Never hand-edit the notes — CHANGELOG.md is the source (AGENTS.md §5).
      - name: Create release with notes extracted from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md dist/*
          fi

  docker:
    name: Publish to GHCR (scratch image from build artifacts)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare image context
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p img/bin/amd64 img/bin/arm64
          tar xzf "dist/molehill-${tag}-x86_64-unknown-linux-musl.tar.gz" -C img/bin/amd64 --strip-components=1
          tar xzf "dist/molehill-${tag}-aarch64-unknown-linux-musl.tar.gz" -C img/bin/arm64 --strip-components=1
          cp /etc/ssl/certs/ca-certificates.crt img/bin/amd64/
          cp /etc/ssl/certs/ca-certificates.crt img/bin/arm64/
          cp Containerfile img/Dockerfile
          file img/bin/amd64/molehill img/bin/arm64/molehill
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: img
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ghcr.io/niyueee/molehill:latest, ghcr.io/niyueee/molehill:${{ github.ref_name }}
      - name: Smoke test pushed container image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 ghcr.io/niyueee/molehill:${{ github.ref_name }}
          docker run --rm ghcr.io/niyueee/molehill:${{ github.ref_name }} --help
          docker buildx imagetools inspect ghcr.io/niyueee/molehill:${{ github.ref_name }}

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish --allow-dirty
