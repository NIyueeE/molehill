name: CI

on:
  # A change limited to markdown, docs/ or assets/ cannot move the Rust gates,
  # so it skips this chain and runs docs.yml instead (the doc gates that such a
  # change CAN break). A commit mixing docs and code paths runs both.
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: full check chain
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (supply-chain hardening); Dependabot
      # tracks the "# vX" comments. See AGENTS.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml (channel = stable + clippy/rustfmt) resolves
      # automatically; the pin freezes the action code, not the toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install check tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-machete,cargo-audit,cargo-outdated,cargo-deny

      - name: Install uv (python bench gates + ruff lint)
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Full check chain (fmt/secrets/machete/docs/ruff/clippy + audit/deny/outdated/test)
        run: just check

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-hack
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-hack

      - name: Check all feature combinations
        run: >
          cargo hack check --feature-powerset --no-dev-deps

  musl:
    name: musl check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two release binaries that carry the full default set (and so
          # the transparent code): the libc-sensitive half of the release
          # matrix. The aarch64 leg runs natively on GitHub's arm64 runner
          # (public repositories), so no emulator sits between the compiler
          # and the code it checks.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add the musl target
        run: rustup target add ${{ matrix.target }}

      # release.yml builds these two artifacts (and the GHCR image) with
      # exactly this feature set; nothing else in CI compiles the full set for
      # musl. The list is the whole default set and has to stay that way: it
      # silently stopped covering the release when `transparent` joined
      # release.yml alone, and a TUN `ioctl` request that only glibc's
      # signature accepts reached the tag. `githooks/check-docs` fails this
      # list if it drifts from Cargo.toml.
      - name: Check the release feature set against musl
        run: >
          cargo check --all-targets --target ${{ matrix.target }}
          --no-default-features
          --features server,client,noise,hot-reload,multiplex,kcp,transparent

  musl-embedded:
    name: musl check ${{ matrix.target }} (embedded)
    runs-on: ubuntu-latest
    strategy:
      # The 32-bit release artifacts build `embedded`, not the full set, and
      # have no native runner: cross's container carries the toolchain.
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-musl-embedded

      - name: Install cross
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cross

      - name: Check the embedded feature set against musl
        run: >
          cross check --all-targets --target ${{ matrix.target }}
          --no-default-features --features embedded

  test-arm64-musl:
    # The release ships this artifact; CI runs the release's test command on
    # it natively, so an aarch64-only failure is found on the PR, not on the
    # tag — both aarch64 failures of the v0.11.0 release were first seen there.
    name: test aarch64-musl (native)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-unknown-linux-musl-test

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add the musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Run tests (serial — the integration suite binds fixed ports)
        run: cargo test --release --target aarch64-unknown-linux-musl -- --test-threads=1

  test-x86_64-musl:
    # The release ships this artifact (it is the GHCR image); CI runs the
    # release's test command on it natively, so the release matrix does not
    # have to re-run the suite to cover it.
    name: test x86_64-musl (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl-test

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Run tests (serial — the integration suite binds fixed ports)
        run: cargo test --release --target x86_64-unknown-linux-musl -- --test-threads=1

  test:
    name: test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default-feature tests already run inside the `check` job's chain;
          # the matrix covers the alternative feature combinations.
          # `embedded` resolves to exactly the `noise` set
          # (server,client,hot-reload,noise), so only the explicit legs run
          # tests; the powerset check compiles every other combination.
          - name: noise
            args: --no-default-features --features server,client,noise,hot-reload
          - name: noise + multiplex
            args: --no-default-features --features server,client,noise,hot-reload,multiplex
          - name: server+client lib only
            args: --lib --no-default-features --features server,client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `matrix.name`, not `matrix.args`: a cache key may not contain a
          # comma, and every `args` entry has one — which is why this leg's
          # cache restore failed with a validation error instead of caching.
          key: ${{ matrix.name }}-test

      - name: Run tests (serial — the integration suite binds fixed ports)
        run: cargo test --verbose ${{ matrix.args }} -- --test-threads=1

  size:
    name: minimal build size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build minimal profile (must not include multiplex)
        run: cargo build --profile minimal --no-default-features --features client

      - name: Record binary size
        run: |
          ls -la target/minimal/molehill
          SIZE=$(stat -c%s target/minimal/molehill)
          echo "minimal binary size: $SIZE bytes"
          echo "$SIZE" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failing platform must not cancel the others: with the default
      # fail-fast a Windows failure left the Linux and macOS legs "cancelled",
      # which reads like a platform verdict and is not one — the release
      # question is whether *every* platform builds.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: molehill
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            exe: molehill
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            exe: molehill.exe
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            exe: molehill
            target: x86_64-apple-darwin
          - os: macos-latest
            exe: molehill
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target || matrix.args }}-build

      - name: Run tests
        # x86_64-linux is the `check` job's target (same target, same
        # features, same runner): this leg proves the platform's binary builds
        # and starts, not that the suite passes twice.
        if: matrix.target != 'aarch64-apple-darwin' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo test --verbose -- --test-threads=1

      - name: Build
        run: cargo build

      - name: Smoke test
        run: ./target/debug/${{ matrix.exe }} --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molehill-${{ matrix.target }}
          path: target/debug/${{ matrix.exe }}
