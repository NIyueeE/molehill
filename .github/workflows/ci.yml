name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "dev"]

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: full check chain
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (supply-chain hardening); Dependabot
      # tracks the "# vX" comments. See AGENTS.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml (channel = stable + clippy/rustfmt) resolves
      # automatically; the pin freezes the action code, not the toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install check tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-machete,cargo-audit,cargo-outdated,cargo-deny

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Full check chain (fmt/secrets/machete/docs/clippy + audit/deny/outdated/test)
        run: just check

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-hack
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-hack

      - name: Check all feature combinations
        run: >
          cargo hack check --feature-powerset --no-dev-deps
          --mutually-exclusive-features default,native-tls,websocket-native-tls,rustls,websocket-rustls

  test:
    name: test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default-feature tests already run inside the `check` job's chain;
          # the matrix covers the alternative feature combinations.
          - name: rustls
            args: --no-default-features --features server,client,rustls,noise,websocket-rustls,hot-reload
          - name: rustls + multiplex
            args: --no-default-features --features server,client,rustls,noise,websocket-rustls,hot-reload,multiplex
          - name: embedded (noise-only)
            args: --no-default-features --features embedded
          - name: server+client lib only
            args: --lib --no-default-features --features server,client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests (serial — the integration suite binds fixed ports)
        run: cargo test --verbose ${{ matrix.args }} -- --test-threads=1

  size:
    name: minimal build size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build minimal profile (must not include multiplex)
        run: cargo build --profile minimal --no-default-features --features client

      - name: Record binary size
        run: |
          ls -la target/minimal/molehill
          SIZE=$(stat -c%s target/minimal/molehill)
          echo "minimal binary size: $SIZE bytes"
          echo "$SIZE" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: molehill
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            exe: molehill.exe
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            exe: molehill
            target: x86_64-apple-darwin
          - os: macos-latest
            exe: molehill
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --verbose -- --test-threads=1

      - name: Build
        run: cargo build

      - name: Smoke test
        run: ./target/debug/${{ matrix.exe }} --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molehill-${{ matrix.target }}
          path: target/debug/${{ matrix.exe }}
