name: Test build

# CD test builds: compile the binary for chosen platforms at an arbitrary
# commit WITHOUT creating a release. See AGENTS.md §6 and docs/release.md.
# Releases are tag-driven only (release.yml); this workflow never publishes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to build"
        required: false
        default: "main"
      targets:
        description: "Platforms, comma-separated (linux, macos, windows)"
        required: false
        default: "linux,macos,windows"

run-name: Test build ${{ inputs.ref }} [${{ inputs.targets }}]

permissions:
  contents: read

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build matrix from requested platforms
        id: plan
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          MATRIX=$(printf '%s' "$REQUESTED" | tr ', ' '\n\n' | sed '/^$/d' | jq -Rsc '
            def platform:
              {
                "linux":   {os: "ubuntu-latest",  target: "x86_64-unknown-linux-gnu"},
                "macos":   {os: "macos-latest",   target: "aarch64-apple-darwin"},
                "windows": {os: "windows-latest", target: "x86_64-pc-windows-msvc"}
              }[.];
            split("\n")
            | map(select(length > 0)
                | platform
                | if . == null then error("unknown platform; use linux, macos, windows") else . end)
            | unique
            | {include: .}
          ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # rust-toolchain.toml resolves the stable toolchain; the job adds the matrix target
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install OpenSSL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install openssl@3

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/molehill
            target/${{ matrix.target }}/release/molehill.exe
          if-no-files-found: error
          retention-days: 7
