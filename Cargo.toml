[package]
name = "molehill-rathole"
version = "0.11.1"
edition = "2024"
authors = ["niyue <n1yu3@proton.me>"]
description = "A lightweight and high-performance reverse proxy for NAT traversal, written in Rust. An alternative to frp and ngrok, with transparent (L3) clients that own their own public IP."
license = "Apache-2.0"
repository = "https://github.com/NIyueeE/molehill"
readme = "README.md"
build = "build.rs"
include = ["src/**/*", "tests/**", "LICENSE", "README.md", "build.rs"]

[[bin]]
name = "molehill"
path = "src/main.rs"

[features]
default = [
    "server",
    "client",
    "noise",
    "hot-reload",
    "multiplex",
    "kcp",
    "transparent",
]

# Run as a server
server = []
# Run as a client
client = ["dep:async-http-proxy", "dep:async-socks5", "dep:serde_json"]

# Noise support. The `snow` dependency pulls the ring-accelerated resolver:
# the ChaCha20-Poly1305 data path runs ring's hardware-dispatched
# implementation for every pattern (the handshake hash — BLAKE2s by
# default, SHA-256/SHA-512 for other patterns — falls back to the
# pure-Rust resolver and only runs once per connection). The u16-framed
# record stream is vendored in-repo (src/transport/noise_stream.rs,
# ported from the unmaintained snowstorm crate, adapted to snow 0.10),
# which needs pin-project.
noise = ["dep:base64", "dep:chacha20poly1305", "dep:snow", "dep:pin-project"]

# Configuration hot-reload support
hot-reload = ["dep:notify"]

# Which carrier the data plane uses, and the fallback that chooses it: KCP
# (with `kcp`) else TCP. Independent of yamux because a transparent claim
# chooses a carrier without multiplexing its own traffic.
carrier = []

# Multiplex many data channels over one physical connection (yamux engine,
# maintained in-repo under src/mux). The tunnel pool needs `carrier`.
multiplex = ["carrier", "dep:parking_lot", "dep:nohash-hasher"]

# Default feature releasing embedded devices
embedded = ["server", "client", "hot-reload", "noise"]

# Feature to enable tokio-console. Disabled by default.
# Don't enable it unless for debugging purposes.
console = ["dep:console-subscriber", "tokio/tracing"]
# A KCP tunnel is a mux tunnel over UDP: the feature implies `multiplex`.
# In the default set so one release binary covers all comparison arms.
kcp = ["multiplex", "dep:log", "dep:thiserror"]
# Transparent (L3) services: the client owns the public `ip:port` instead of
# the server binding it, so the visitor's packets reach the client's TUN device
# and its kernel answers them -- the backend sees the visitor's real address
# and the server holds no connection state. Linux and macOS run both ends;
# Windows can serve a transparent client but cannot be one (it has no
# source-address policy routing), and a config that asks for a client there is
# refused with a precise reason. The device layer is `tun-rs`. `carrier` is
# implied: a claim chooses KCP/TCP per lane and reads the lane budget, but its
# own traffic is one connection per lane and never yamux, so `multiplex` is
# not required. `noise` is implied too: the control channel that carries a
# claim's registration is always Noise.
transparent = ["dep:tun-rs", "carrier", "noise"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
hex = "0.4"
rand = "0.10"
backon = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Colored log levels for the custom log formatter (see `src/logging.rs`)
nu-ansi-term = "0.50"
socket2 = { version = "0.6", features = ["all"] }
fdlimit = "0.3"
async-trait = "0.1"
base64 = { version = "0.23", optional = true }
notify = { version = "8", optional = true }
console-subscriber = { version = "0.5", optional = true, features = [
    "parking_lot",
] }
async-http-proxy = { version = "1.2", features = ["runtime-tokio", "basic-auth"], optional = true }
async-socks5 = { version = "0.6", optional = true }
url = { version = "2.2", features = ["serde"] }
snow = { version = "0.10", features = ["ring-accelerated"], optional = true }
pin-project = { version = "1.1.13", optional = true }
log = { version = "0.4.34", optional = true }
thiserror = { version = "2.0.20", optional = true }
parking_lot = { version = "0.12.5", optional = true }
nohash-hasher = { version = "0.2.0", optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tun-rs = { version = "2.8.12", default-features = false, features = ["async_tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }

[build-dependencies]
vergen = { version = "10.0.2", default-features = false, features = ["build", "cargo"] }
vergen-gitcl = { version = "10.0.2", default-features = false, features = ["build", "cargo"] }
anyhow = "1.0"

[lints.rust]
# Unsafe is denied outright: the audited FFI module asks for it per item with
# `#[expect(unsafe_code, reason = ...)]`, so an unexpected `unsafe` fails a
# plain `cargo build` and not only the `-D warnings` gate. See
# docs/lint-policy.md, "Unsafe".
unsafe_code = "deny"
# The public API (lib surface, config structs, CLI) carries doc comments
missing_docs = "warn"
# cross's musl linker wrapper prints trace output to stderr; real linker
# errors still fail the build
linker_messages = "allow"

[lints.clippy]
# No panics or debug leftovers in production code; every unsafe block must
# carry a SAFETY comment
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# stubs get removed, not accumulated (AGENTS.md §9)
todo = "warn"
# rust-agents-template parity: the whole pedantic group is denied. Members
# that legitimately do not fit this codebase are relaxed per-item in code
# (with a reason), never here — see docs/lint-policy.md.
# The group needs a lower priority than the individual lints above.
pedantic = { level = "deny", priority = -1 }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["socket", "net", "feature", "uio"] }
