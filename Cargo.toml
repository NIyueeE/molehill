[package]
name = "molehill-rathole"
version = "0.8.0"
edition = "2024"
authors = ["niyue <n1yu3@proton.me>"]
description = "A lightweight and high-performance reverse proxy for NAT traversal, written in Rust. An alternative to frp and ngrok."
license = "Apache-2.0"
repository = "https://github.com/NIyueeE/molehill"
readme = "README.md"
build = "build.rs"
include = ["src/**/*", "tests/**", "LICENSE", "README.md", "build.rs"]

[[bin]]
name = "molehill"
path = "src/main.rs"

[features]
default = [
    "server",
    "client",
    "noise",
    "hot-reload",
    "multiplex",
    "kcp",
]

# Run as a server
server = []
# Run as a client
client = []

# Noise support. The `snow` feature pulls the ring-accelerated resolver:
# the ChaCha20-Poly1305 data path runs ring's hardware-dispatched
# implementation for every pattern (the handshake hash — BLAKE2s by
# default, SHA-256/SHA-512 for other patterns — falls back to the
# pure-Rust resolver and only runs once per connection). The u16-framed
# record stream is vendored in-repo (src/transport/noise_stream.rs,
# ported from the unmaintained snowstorm crate, adapted to snow 0.10),
# which needs pin-project.
noise = ["base64", "snow", "pin-project"]

# Configuration hot-reload support
hot-reload = ["notify"]

# Multiplex many data channels over one physical connection (yamux)
multiplex = ["dep:yamux", "tokio-util/compat"]

# Default feature releasing embedded devices
embedded = ["server", "client", "hot-reload", "noise"]

# Feature to enable tokio-console. Disabled by default.
# Don't enable it unless for debugging purposes.
console = ["console-subscriber", "tokio/tracing"]
# A KCP tunnel is a mux tunnel over UDP: the feature implies `multiplex`.
# In the default set so one release binary covers all comparison arms.
kcp = [ "multiplex"]
snow = ["dep:snow"]
pin-project = ["dep:pin-project"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
hex = "0.4"
rand = "0.10"
backon = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Colored log levels for the custom log formatter (see `src/logging.rs`)
nu-ansi-term = "0.50"
socket2 = { version = "0.6", features = ["all"] }
fdlimit = "0.3"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
notify = { version = "8", optional = true }
console-subscriber = { version = "0.5", optional = true, features = [
    "parking_lot",
] }
async-http-proxy = { version = "1.2", features = [
    "runtime-tokio",
    "basic-auth",
] }
async-socks5 = "0.6"
url = { version = "2.2", features = ["serde"] }
tokio-util = { version = "0.7.9", optional = true }
yamux = { version = "0.14", optional = true }
snow = { version = "0.10", features = ["ring-accelerated"], optional = true }
pin-project = { version = "1.1.13", optional = true }
log = "0.4.34"
thiserror = "2.0.20"
libc = "0.2.189"

[build-dependencies]
vergen = { version = "10.0.2", default-features = false, features = ["build", "cargo"] }
vergen-gitcl = { version = "10.0.2", default-features = false, features = ["build", "cargo"] }
anyhow = "1.0"

[lints.rust]
# Confine unsafe code to the audited module that opts in explicitly
unsafe_code = "warn"
# The public API (lib surface, config structs, CLI) carries doc comments
missing_docs = "warn"
# cross's musl linker wrapper prints trace output to stderr; real linker
# errors still fail the build
linker_messages = "allow"

[lints.clippy]
# No panics or debug leftovers in production code; every unsafe block must
# carry a SAFETY comment
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# stubs get removed, not accumulated (AGENTS.md §9)
todo = "warn"
# rust-agents-template parity: the whole pedantic group is denied. Members
# that legitimately do not fit this codebase are relaxed per-item in code
# (with a reason), never here — see docs/lint-policy.md.
# The group needs a lower priority than the individual lints above.
pedantic = { level = "deny", priority = -1 }
