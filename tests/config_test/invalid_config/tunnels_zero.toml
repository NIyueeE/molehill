# expect: `[client.data.tcp].tunnels` must be at least 1
# requires: multiplex

# The count is what the pool establishes at service start, so `0` would mean
# "a pool that may never hold a tunnel". It is refused with the carrier's name
# rather than clamped, so a typo is visible.

[client]
default_token = "t"

[client.control]
default_remote_addr = "example.com:2333"

[client.data.tcp]
tunnels = 0

[client.services.test]
local_addr = "127.0.0.1:80"
remote_bind_addr = "0.0.0.0:6080"
