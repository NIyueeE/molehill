# requires: transparent

# A transparent service stays plain while its siblings may encrypt: the rule is
# per service, so a client-wide `type = "noise"` cannot be used with one, and
# the encrypted siblings set it themselves.

[client]
default_token = "t"

[client.control]
default_remote_addr = "example.com:2333"

[client.services.web]
protocol = "transparent"
remote_bind_addr = "10.99.0.1:8443"

[client.services.ssh]
protocol = "tcp"
local_addr = "127.0.0.1:22"
remote_bind_addr = "10.99.0.1:2222"
transport = { type = "noise", noise = { remote_public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" } }
