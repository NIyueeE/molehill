# requires: transparent-client

# An L3 client is its own run mode: one block, and every service it has is a
# claim on a public address. There is no `protocol` key here, and the keys a
# forwarding service would use (`local_addr`, `nodelay`, the UDP-only ones) have
# no home in this schema at all.

[transparent]
default_token = "t"
tun = "molehill-test0"

[transparent.control]
default_remote_addr = "example.com:2333"

# The control channel is always Noise

[transparent.noise]
public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

private_key = "8JlJQXXN0lFqz5ghIjJRq3bfRiCDKJHuXxbfu5jIxWE="

[transparent.claims.web]
remote_bind_addr = "10.99.0.1:8443"
