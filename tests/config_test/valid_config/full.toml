[client]
remote_addr = "example.com:2333" # Necessary. The address of the server
default_token = "default_token_if_not_specify" # Optional. The default token of services, if they don't define their own ones
heartbeat_timeout = 40 # Optional. Must be greater than `server.heartbeat_interval`. Default: 40 seconds
retry_interval = 1 # Optional. Default: 1 second
prefer_ipv6 = false # Optional. Default: false

[client.transport]
type = "tcp" # Optional. Possible values: ["tcp", "tls"]. Default: "tcp"

[client.transport.tcp] # Optional. TCP socket options (also apply to `tls` and `noise`)
proxy = "socks5://user:passwd@127.0.0.1:1080" # Optional. Connect through a proxy
nodelay = true # Optional. Default: true
keepalive_secs = 20 # Optional. Default: 20 seconds
keepalive_interval = 8 # Optional. Default: 8 seconds

[client.transport.tls] # Necessary if `type` is "tls"
trusted_root = "ca.pem" # Necessary. The certificate of CA that signed the server's certificate
hostname = "example.com" # Optional. The hostname that the client uses to validate the certificate. If not set, fallback to `client.remote_addr`

[client.transport.noise] # Noise protocol. See `docs/transport.md` for further explanation
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s" # Optional. Default value as shown
local_private_key = "key_encoded_in_base64" # Optional
remote_public_key = "key_encoded_in_base64" # Optional
psk = "key_encoded_in_base64" # Optional. Pre-shared key (32 bytes, base64-encoded); the pattern must include a PSK modifier
psk_location = 0 # Optional. The PSK slot index used in the pattern. Default: 0

[client.transport.websocket] # Necessary if `type` is "websocket"
tls = true # Necessary. TLS on the WebSocket connection

[client.services.service1] # A service that needs forwarding. The name `service1` can change arbitrarily, as long as identical to the name in the server's configuration
type = "tcp" # Optional. The protocol that needs forwarding. Possible values: ["tcp", "udp"]. Default: "tcp"
token = "whatever" # Necessary if `client.default_token` not set
prefer_ipv6 = false # Optional. If the client prefers to use IPv6 when connecting to the server (e.g.: When the client is behind an ISP's NAT). Default: false
local_addr = "127.0.0.1:1081" # Necessary. The address of the service that needs to be forwarded
nodelay = true # Optional. Override the global `nodelay` per service
retry_interval = 1 # Optional. Override the global `retry_interval` per service

[client.services.service2] # Multiple services can be defined
type = "udp" # Optional. A UDP service
local_addr = "127.0.0.1:1082"

[server]
bind_addr = "0.0.0.0:2333" # Necessary. The address that the server listens for clients. Generally only the port needs to be change. 
default_token = "default_token_if_not_specify" # Optional
heartbeat_interval = 30 # Optional. Default: 30 seconds

[server.transport]
type = "tcp" # Same as `[client.transport]`

[server.transport.tcp] # Same as the client
nodelay = true
keepalive_secs = 20
keepalive_interval = 8

[server.transport.tls] # Necessary if `type` is "tls"
pkcs12 = "identify.pfx" # Necessary. pkcs12 file of server's certificate and private key
pkcs12_password = "password" # Necessary. Password of the pkcs12 file

[server.transport.noise] # Same as `[client.transport.noise]`
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s"
local_private_key = "key_encoded_in_base64" 
remote_public_key = "key_encoded_in_base64" 
psk = "key_encoded_in_base64" # Optional. Pre-shared key (32 bytes, base64-encoded); the pattern must include a PSK modifier
psk_location = 0 # Optional. The PSK slot index used in the pattern. Default: 0

[server.transport.websocket] # Necessary if `type` is "websocket"
tls = true # Necessary. TLS on the WebSocket connection

[server.services.service1] # The service name must be identical to the client side
type = "tcp" # Optional. Same as the client `[client.services.X.type]
token = "whatever" # Necesary if `server.default_token` not set
bind_addr = "0.0.0.0:8081" # Necessary. The address of the service is exposed at. Generally only the port needs to be change. 
nodelay = true # Optional. Override the global `nodelay` per service

[server.services.service2] 
type = "udp" # Optional. A UDP service
bind_addr = "0.0.0.1:8082"
