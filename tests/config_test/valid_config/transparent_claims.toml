# requires: transparent

# Every per-claim override a claim has, plus the one key the L3 transport table
# does have (`proxy` — a transparent client is a plain link by design, so the
# schema holds no encryption key at all).

[transparent]
default_token = "t"
tun = "molehill-test0"

[transparent.control]
default_remote_addr = "example.com:2333"
default_retry_interval = 2

[transparent.data]
default_carrier = "kcp"

[transparent.data.kcp]
tunnels = 6

[transparent.transport]
proxy = "socks5://127.0.0.1:1080"

[transparent.claims.web]
remote_bind_addr = "10.99.0.1:8443"

[transparent.claims.ssh]
remote_bind_addr = "10.99.0.1:2222"
token = "per-claim-token"
remote_addr = "other.example.com:2333"
retry_interval = 5
carrier = "tcp"
