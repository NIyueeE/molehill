# requires: transparent-client

# Every per-claim override a claim has, plus the L3 transport table's keys:
# `proxy` for the path to the server, and the Noise key pair the control
# channel requires (the lanes are plain unless the table also writes
# `type = "noise"`).

[transparent]
default_token = "t"
tun = "molehill-test0"

[transparent.control]
default_remote_addr = "example.com:2333"
default_retry_interval = 2

[transparent.data]
tunnels = 6

[transparent.transport]
proxy = "socks5://127.0.0.1:1080"

[transparent.transport.noise]
local_private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE=" # security-scan:allow fixture keypair, the shared test pair from noise_transport.toml

[transparent.claims.web]
remote_bind_addr = "10.99.0.1:8443"

[transparent.claims.ssh]
remote_bind_addr = "10.99.0.1:2222"
token = "per-claim-token"
remote_addr = "other.example.com:2333"
retry_interval = 5
