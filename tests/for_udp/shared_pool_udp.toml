# The UDP side of the shared pinned pool: one UDP service whose affinity peer
# must keep its source port for as long as it talks, whatever the pool does.
#
# `tunnels = 3` is the session's pool, established at that count and never
# resized, so the tunnel the visitor's peer is pinned to is never given back
# (D30). The UDP worker set is a stream-level concern now: it shares tunnels
# rather than demanding one per worker.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential

[client.control]
default_remote_addr = "127.0.0.1:2385"

[client.noise]
public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

private_key = "8JlJQXXN0lFqz5ghIjJRq3bfRiCDKJHuXxbfu5jIxWE="

[client.data]
tunnels = 3

[client.services.game]
protocol = "udp"
local_addr = "127.0.0.1:8083"
remote_bind_addr = "127.0.0.1:2386"
max_udp_workers = 2

[server]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential
allow_ports = ["2386"]

[server.control]
bind_addr = "127.0.0.1:2385"

[server.noise]
private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
public_key = "zDdpcSQP+7Y5Mr+7UdEZMkz3gO6NGbQ1hko8/yt5knE="
