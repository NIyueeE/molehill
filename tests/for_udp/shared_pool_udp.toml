# The UDP side of the shared pinned pool: one UDP service whose affinity peer
# must keep its source port for as long as it talks, whatever the pool does.
#
# The numbers are chosen so the floor is visible in the state: `udp_workers = 2`
# is the UDP-derived floor, and `tunnels = 3` starts the pool one tunnel above
# it — the pool is established at that count and never resizes, so the tunnel
# the visitor's peer is pinned to is never given back (D30).

[client]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential

[client.control]
default_remote_addr = "127.0.0.1:2385"

[client.transport]
type = "plain"

[client.data]
default_mode = "multiplex"
default_carrier = "tcp"
shared_pool = true

[client.data.tcp]
tunnels = 3

[client.services.game]
protocol = "udp"
local_addr = "127.0.0.1:8083"
remote_bind_addr = "127.0.0.1:2386"
udp_workers = 2
udp_idle_timeout = 60

[server]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential
allow_ports = ["2386"]

[server.control]
bind_addr = "127.0.0.1:2385"
