# Mixed-data-transport fixture, server A side: the control channel is Noise
# at both ends (the mandatory rule), and the data planes differ — this
# file's [client] block dials echo over a plain data channel
# (`[client.services.echo].transport.type = "plain"`, the payload-carries-
# its-own-crypto override), while the client in mixed_client_noise.toml
# inherits Noise data. Both register against the same server.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures

[client.control]
default_remote_addr = "127.0.0.1:2348"

[client.transport]
type = "noise"

[client.transport.noise]
remote_public_key = "fhfbkUGkVR1f5buTxhLiVQPKP93tQD0lrVEIT2QelqE=" # security-scan:allow dummy fixture keypair, generated for this fixture

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2334"
[client.services.echo.transport]
type = "plain"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures
allow_ports = ["2334-2337"]

[server.control]
bind_addr = "127.0.0.1:2348"

[server.transport.noise]
local_private_key = "fhfbkUGkVR1f5buTxhLiVQPKP93tQD0lrVEIT2QelqE=" # security-scan:allow dummy fixture keypair, generated for this fixture
