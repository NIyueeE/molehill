# The operator's valve (`[server.data].max_tunnels_per_client`) against a
# client that asks for more: the client's own count is 2, the server's valve
# is 1, so one of the two startup establishments is refused while the tunnel
# the client got keeps forwarding. `tests/pool_test.rs` asserts the pool holds
# at one tunnel and that the session survives the refusal; the refusal's own
# report (once, not per attempt) is asserted on the real binary in the same
# file.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential

[client.control]
default_remote_addr = "127.0.0.1:2370"

[client.transport]
type = "plain"

[client.data]
default_mode = "multiplex"
default_carrier = "tcp"

[client.data.tcp]
tunnels = 2

[client.services.valve]
local_addr = "127.0.0.1:8090"
remote_bind_addr = "127.0.0.1:2371"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential
allow_ports = ["2371"]

[server.control]
bind_addr = "127.0.0.1:2370"

[server.data]
max_tunnels_per_client = 1
