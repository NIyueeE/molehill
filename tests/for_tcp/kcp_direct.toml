# Carrier and mode are independent: `default_mode = "direct"` means one data
# channel per visitor with no multiplexer above the carrier, and
# `default_carrier = "kcp"` makes that channel a KCP-over-UDP session instead of
# a TCP connection. The control channel stays TCP+Noise, so the KCP sessions
# are Noise-wrapped with the same keys — the crypto stack follows the service's
# transport, not the carrier.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures

[client.control]
default_remote_addr = "127.0.0.1:2333"

[client.data]
default_mode = "direct"
default_carrier = "kcp"
default_data_addr = "127.0.0.1:2343"

[client.transport]
type = "noise"

[client.transport.noise]
remote_public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2334"

[client.services.pingpong]
local_addr = "127.0.0.1:8081"
remote_bind_addr = "0.0.0.0:2335"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures
allow_ports = ["2334-2337"]

[server.control]
bind_addr = "0.0.0.0:2333"

[server.data]
bind_addr = "127.0.0.1:2343"

[server.transport.noise]
local_private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
