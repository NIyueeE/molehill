# A TCP tunnel pool with a visitor ceiling and nothing to resize it: no
# service opens channels up front (a TCP service opens one per visitor, on
# demand), and `tunnels = 2` is the count the pool establishes at service
# start and keeps — for the whole service lifetime, under load and while
# idle. Two tunnels at the placement ceiling carry 112 concurrent visitors;
# the ones past that are refused rather than paid for with a third tunnel or
# a terminated one.
#
# `tests/pool_test.rs` reads the pool's own state (`live_pools()`), so the
# numbers here are the ones those assertions expect.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential

[client.control]
default_remote_addr = "127.0.0.1:2395"

[client.transport]
type = "plain"

[client.data]
default_carrier = "tcp"

[client.data.tcp]
tunnels = 2

[client.services.idle]
local_addr = "127.0.0.1:8090"
remote_bind_addr = "127.0.0.1:2396"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential
allow_ports = ["2396"]

[server.control]
bind_addr = "127.0.0.1:2395"
