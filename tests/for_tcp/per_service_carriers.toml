# Per-service data-plane overrides: `[client.data]` provides the default
# carrier, and `[client.services.*]` overrides it per service. Here echo rides
# the default (TCP) and pingpong its own KCP-over-UDP sessions — one client,
# two carriers, two pools, no server-side configuration beyond the usual
# policy (the server opens its KCP listener on the first `kcp` registration).
# Requires a binary built with the `kcp` feature.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures

[client.control]
default_remote_addr = "127.0.0.1:2345"

[client.data]
default_carrier = "tcp"
default_data_addr = "127.0.0.1:2344"

[client.transport]
type = "noise"

[client.transport.noise]
remote_public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2334"

[client.services.pingpong]
local_addr = "127.0.0.1:8081"
remote_bind_addr = "0.0.0.0:2335"
carrier = "kcp"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures
allow_ports = ["2334-2337"]

[server.control]
bind_addr = "0.0.0.0:2345"

[server.data]
bind_addr = "127.0.0.1:2344"

[server.transport.noise]
local_private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
