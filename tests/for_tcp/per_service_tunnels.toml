# Per-service data-plane overrides: `[client.data]` provides the default pool
# width and `[client.services.*].tunnels` overrides it per service. Here echo
# rides the default (four tunnels) and pingpong keeps two of its own — one
# client, two pool widths, no server-side configuration beyond the usual
# policy. The carrier is not part of it: every service tries mhd first and
# falls back to TCP on its own, so the server opens its mhd listener on the
# first registration that declares it.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures

[client.control]
default_remote_addr = "127.0.0.1:2345"

[client.data]
default_data_addr = "127.0.0.1:2346"

[client.noise]
public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

private_key = "8JlJQXXN0lFqz5ghIjJRq3bfRiCDKJHuXxbfu5jIxWE="

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2334"

[client.services.pingpong]
local_addr = "127.0.0.1:8081"
remote_bind_addr = "0.0.0.0:2335"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures
allow_ports = ["2334-2337"]

[server.control]
bind_addr = "0.0.0.0:2345"

[server.data]
bind_addr = "127.0.0.1:2346"

[server.noise]
private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
public_key = "zDdpcSQP+7Y5Mr+7UdEZMkz3gO6NGbQ1hko8/yt5knE="
