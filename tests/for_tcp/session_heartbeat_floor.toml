# Fixture for `a_timeout_below_the_heartbeat_floor_is_refused_once`.
#
# The server declares a 30 s cadence, so the client's derived floor is
# `2 × 30 + 5 = 65` s. The configured 20 s cannot survive it — a healthy
# server would look dead every 20 s — so the session refuses to run at all:
# one authenticated connection, a terminal error naming both numbers, and no
# exposed port.

[client]
# the token is shared with every other fixture and is not a credential
default_token = "default_token_if_not_specify"  # security-scan:allow fixture token

[client.control]
default_remote_addr = "127.0.0.1:2378"
default_heartbeat_timeout = 20

[client.noise]
public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

private_key = "8JlJQXXN0lFqz5ghIjJRq3bfRiCDKJHuXxbfu5jIxWE="

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2379"

[server]
# the token is shared with every other fixture and is not a credential
default_token = "default_token_if_not_specify"  # security-scan:allow fixture token
allow_ports = ["2379"]

[server.control]
bind_addr = "127.0.0.1:2378"
heartbeat_interval = 30

[server.noise]
private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
public_key = "zDdpcSQP+7Y5Mr+7UdEZMkz3gO6NGbQ1hko8/yt5knE="
