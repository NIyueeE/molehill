# Per-service transport fixture: the client-wide transport (control AND
# data default) is Noise, and one service overrides its data plane back to
# plain (`transport.type = "plain"`) — the payload-carries-its-own-crypto
# scenario. One client, two data transports, one Noise control channel.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures

[client.control]
default_remote_addr = "127.0.0.1:2349"

[client.transport]
type = "noise"

[client.transport.noise]
remote_public_key = "sukCwgWeNuVWd0gSm+dgQT636fWfzfV7U16b8xwxDxc=" # security-scan:allow dummy fixture keypair, generated for this fixture

[client.services.echo]
local_addr = "127.0.0.1:8080"
remote_bind_addr = "0.0.0.0:2334"

[client.services.pingpong]
local_addr = "127.0.0.1:8081"
remote_bind_addr = "0.0.0.0:2335"
[client.services.pingpong.transport]
type = "plain"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow dummy fixture token, same value as the sibling transport fixtures
allow_ports = ["2334-2337"]

[server.control]
bind_addr = "127.0.0.1:2349"

[server.transport.noise]
local_private_key = "fhfbkUGkVR1f5buTxhLiVQPKP93tQD0lrVEIT2QelqE=" # security-scan:allow dummy fixture keypair, generated for this fixture
