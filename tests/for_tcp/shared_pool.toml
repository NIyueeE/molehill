# One pinned pool for a session (M2a): two services of one client draw on the
# same pool, and the pool's own state — its establishment, its placement, its
# pinned peers — is what the assertions read. `tunnels = 4` is the count the
# pool establishes at service start and keeps: it neither grows for load nor
# shrinks when idle.
#
# One client per process: the client's live pools are a process-global
# registry, so running two scenarios in one process would mix their pools.
# `tests/pool_test.rs` runs one scenario per test binary invocation... per
# test, which is why each of its scenarios uses its own fixture.

[client]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential

[client.control]
default_remote_addr = "127.0.0.1:2380"

[client.noise]
public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

private_key = "8JlJQXXN0lFqz5ghIjJRq3bfRiCDKJHuXxbfu5jIxWE="

[client.data]
tunnels = 4

[client.services.alpha]
local_addr = "127.0.0.1:8090"
remote_bind_addr = "127.0.0.1:2381"

[client.services.beta]
local_addr = "127.0.0.1:8091"
remote_bind_addr = "127.0.0.1:2382"

[server]
default_token = "default_token_if_not_specify" # security-scan:allow fixture placeholder, not a credential
allow_ports = ["2381-2382"]

[server.control]
bind_addr = "127.0.0.1:2380"

[server.noise]
private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="
public_key = "zDdpcSQP+7Y5Mr+7UdEZMkz3gO6NGbQ1hko8/yt5knE="
