[project]
name = "bench"
version = "0.1.0"
description = "The molehill performance model."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]

[dependency-groups]
lint = [
    "ruff==0.17.1",
]
typecheck = [
    "pyright==1.1.414",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "E402",   # imports stay at the top of the file (guards a future sys.path hack)
    "E501",   # line length: the formatter wraps code, but a docstring or URL
              # can still run long, and one had drifted to 94 characters
    "I",      # import sorting
    "UP",     # pyupgrade
    "SIM",    # simplify
    "EXE",    # shebang + exec bit must agree
    "BLE",    # blind-except audit (each waiver is inline at its own site)
    "PL",     # pylint rules
    "RUF",    # ruff-specific
    "ISC",    # implicit string concat
    "FURB",   # refurb
    "S",      # bandit
    "B",      # bugbear (mutable defaults, zip(strict=), ...)
    "E7",     # ambiguous names (l/O/I) -- invisible to the rest of the set
    "ARG",    # unused arguments: a dead parameter is a smell, not a signature
    "PTH",    # prefer pathlib: these tools build and read paths constantly
    "RET",    # return-statement consistency
    "C4",     # comprehensions
    "N",      # naming conventions
    "FA",     # from __future__ placement
    "FLY",    # f-string join instead of a str.join call
    "PERF",   # perflint's loop-invariant checks
    "C901",   # cyclomatic complexity (default limit 10): the two functions
              # over it were split rather than waived, and each split was
              # checked to leave stdout and exit codes byte-identical
    "DTZ",    # naive datetimes: these tools timestamp runs and compare them
    "TID",    # package-internal imports are absolute; a relative import would
              # break the `uv run` entry shape the probes and l3 helpers keep
    "PIE",    # misc dead code (useless `pass`, unnecessary `map`, ...)
    "PGH",    # blanket `# type: ignore` (waive per code, never per file)
    "LOG",    # logging misuse in the shared bench lib
]

# Waivers — repo-wide only for the one property that is genuinely true of
# every tool here. Everything else is waived inline at its own site with a
# reason (AGENTS.md §2: fix the code first, waive in code, minimal scope).
#
# - S602/S603/S607: these tools measure processes that ARE external binaries
#   reached through PATH (iperf3, tc, ss, the peers). Resolving them
#   differently would measure a different program than the one documented.
#
# Deliberately NOT selected, and why (checked, not guessed):
# - TRY/EM: 18 of TRY's 21 findings are TRY003 ("long message outside the
#   exception class"), which fights this codebase's house style: the message
#   *is* the instruction ("restore it with: ip link set dev lo mtu 1280").
#   Adopting it would mean inventing an exception class per site.
# - ANN: the code annotates where the type carries information and leaves the
#   rest to inference; ANN001-003 would demand annotations on every parameter.
# - T20: every `print` here is deliberate output (the runner logs live, the
#   plotter emits markdown, the gate emits verdicts).
# - COM812 (trailing comma): ruff's own formatter documents it as a conflicting
#   rule and prints a warning when both are enabled; it rewrites exactly the
#   files `ruff format` owns, so the lint gate and the format gate fight over
#   the tree. The formatter already inserts a trailing comma where its own
#   style wants one (magic trailing comma), so nothing is lost.
ignore = ["S602", "S603", "S607"]

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = true
