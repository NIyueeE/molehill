# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Wired into githooks/pre-push and CI via `just check`.

[graph]
# collect metadata with all features so no platform/feature dep tree is missed
all-features = true

[licenses]
version = 2
# permissive licenses accepted for dependencies; extend as needed.
# Listed exactly as wide as the graph needs: cargo-deny reports an allowance no
# dependency uses (`license-not-encountered`), and "extend as needed" is what
# that warning asks for — a new dependency under a new permissive license adds
# its line here, consciously, instead of the list carrying entries that nothing
# has exercised for releases.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# Waiver (AGENTS.md §2, upstream problem): chacha20 0.10.1 was yanked upstream
# with no compatible replacement — it arrives transitively via rand 0.10 (the
# ^0.10 range has no newer chacha20) and rand 0.10.2 is already the newest
# release. Re-evaluate when rand bumps its chacha20 requirement.
ignore = [
  { crate = "chacha20@0.10.1", reason = "yanked upstream; no fix available through rand 0.10" },
  # RUSTSEC-2026-0542: humantime is unmaintained because chrono is, and there is
  # no safe upgrade. It arrives only through `console-subscriber`, behind the
  # optional `console` feature, which is neither in the default set nor used by
  # any release build — no shipped artifact carries it.
  { id = "RUSTSEC-2026-0542", reason = "unmaintained transitive dep of the optional console feature; no fix exists and no release build enables it" },
]
