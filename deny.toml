# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Wired into githooks/pre-push and CI via `just check`.

[graph]
# collect metadata with all features so no platform/feature dep tree is missed
all-features = true

[licenses]
version = 2
# permissive licenses accepted for dependencies; extend as needed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# Waiver (AGENTS.md §2, upstream problem): chacha20 0.10.1 was yanked upstream
# with no compatible replacement — it arrives transitively via rand 0.10 (the
# ^0.10 range has no newer chacha20) and rand 0.10.2 is already the newest
# release. Re-evaluate when rand bumps its chacha20 requirement.
ignore = [
  { crate = "chacha20@0.10.1", reason = "yanked upstream; no fix available through rand 0.10" },
]
