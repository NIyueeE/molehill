<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Mole body gradient -->
    <linearGradient id="mole-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A756A"/>
      <stop offset="100%" stop-color="#5A4A42"/>
    </linearGradient>
    
    <!-- Mole side gradient -->
    <linearGradient id="mole-side-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A655D"/>
      <stop offset="100%" stop-color="#4A3A35"/>
    </linearGradient>

    <!-- Volcano (lava) gradient -->
    <linearGradient id="volcano-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#B33939"/>
    </linearGradient>

    <!-- Volcano top glow gradient (penetration feel) -->
    <radialGradient id="lava-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF6B6B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B33939" stop-opacity="0"/>
    </radialGradient>

    <!-- Paw gradient -->
    <linearGradient id="paw-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBB4A0"/>
      <stop offset="100%" stop-color="#C09682"/>
    </linearGradient>

    <!-- Nose gradient -->
    <linearGradient id="nose-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAD0C4"/>
      <stop offset="100%" stop-color="#E8A093"/>
    </linearGradient>

    <!-- Data stream line gradient -->
    <linearGradient id="data-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="50%" stop-color="#50E3C2"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>

    <!-- Global drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Mole body clip path -->
    <clipPath id="mole-clip">
      <path d="M 196,325 V 245 C 196,175 316,175 316,245 V 325 Z" />
    </clipPath>

    <!-- Volcano clip path -->
    <clipPath id="volcano-clip">
      <path d="M 68,410 C 115,385 142,305 168,256 C 182,230 198,245 220,285 C 236,315 256,322 256,322 C 256,322 276,315 292,285 C 314,245 330,230 344,256 C 370,305 397,385 444,410 Z" />
    </clipPath>

    <!-- Snout clip path -->
    <clipPath id="snout-clip">
      <path d="M 235,250 C 235,230 277,230 277,250 C 277,274 274,295 256,295 C 238,295 235,274 235,250 Z" />
    </clipPath>
  </defs>

  <!-- White background for GitHub README -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Shift entire logo down to lower the center of gravity -->
  <!-- 修改了这里的 transform 属性，实现整体放大并居中 -->
  <g id="molehill-logo" transform="translate(256, 256) scale(1.2) translate(-256, -256) translate(0, -42)" filter="url(#shadow)">
    
    <!-- Volcano crater shadow (translucent dark red blending with volcano) -->
    <ellipse cx="256" cy="305" rx="72" ry="24" fill="#1A0000" opacity="0.15"/>

    <!-- Mole body -->
    <g id="mole">
      <g clip-path="url(#mole-clip)">
        <rect x="180" y="160" width="150" height="180" fill="url(#mole-body-grad)" />
        <path d="M 272,175 C 290,200 298,245 298,325 H 330 V 175 Z" fill="url(#mole-side-grad)" />
        <path d="M 196,316 C 236,324 276,324 316,316 V 330 H 196 Z" fill="#4A3A35" opacity="0.6" />
      </g>
      
      <!-- Eyes (with highlights) -->
      <circle cx="226" cy="232" r="7.5" fill="#333344" />
      <circle cx="228.5" cy="229.5" r="2.5" fill="#FFFFFF" opacity="0.9"/>
      
      <circle cx="286" cy="232" r="7.5" fill="#333344" />
      <circle cx="288.5" cy="229.5" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    
      <!-- Nose base -->
      <path d="M 240,255 C 240,235 282,235 282,255 C 282,279 279,300 261,300 C 243,300 240,279 240,255 Z" fill="#4A3A35" />
    </g>
    
    <!-- Volcano (mountain body) -->
    <g id="volcano" clip-path="url(#volcano-clip)">
      <rect x="50" y="210" width="410" height="210" fill="url(#volcano-grad)" />
      <rect x="50" y="210" width="410" height="210" fill="url(#lava-glow)" />
      <path d="M 215,280 L 256,322 L 256,305 C 240,300 225,290 215,280 Z" fill="#7A1F1F" opacity="0.8" />
      <path d="M 256,322 C 268,348 290,380 326,420 H 460 V 220 H 285 Z" fill="#D64541" />
    </g>
    
    <!-- Left paw (unified soft shadow, enlarged for better grip) -->
    <g id="left-paw" transform="translate(198, 280) rotate(22)">
      <ellipse cx="0" cy="8" rx="17" ry="9" fill="#000000" opacity="0.12"/>
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#paw-grad)" />
      <circle cx="-8" cy="7" r="3.5" fill="#FFDACD" />
      <circle cx="0" cy="9" r="3.5" fill="#FFDACD" />
      <circle cx="8" cy="7" r="3.5" fill="#FFDACD" />
    </g>
    
    <!-- Right paw (unified soft shadow) -->
    <g id="right-paw" transform="translate(314, 280) rotate(-22)">
      <ellipse cx="0" cy="8" rx="17" ry="9" fill="#000000" opacity="0.12"/>
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#paw-grad)" />
      <circle cx="-8" cy="7" r="3.5" fill="#FFDACD" />
      <circle cx="0" cy="9" r="3.5" fill="#FFDACD" />
      <circle cx="8" cy="7" r="3.5" fill="#FFDACD" />
    </g>
    
    <!-- Whiskers and snout area -->
    <g id="whiskers-and-snout">
      <!-- Whiskers (thinner, more natural color) -->
      <g stroke="#7A5D53" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M 238,256 C 215,254 196,258 182,265" />
        <path d="M 238,266 C 214,268 195,276 180,286" />
        <path d="M 238,276 C 218,280 200,294 188,306" />
    
        <path d="M 274,256 C 297,254 316,258 330,265" />
        <path d="M 274,266 C 298,268 317,276 332,286" />
        <path d="M 274,276 C 294,280 312,294 324,306" />
      </g>
    
      <!-- Snout base -->
      <g clip-path="url(#snout-clip)">
        <rect x="230" y="225" width="55" height="75" fill="#6B4F45" />
        <rect x="256" y="225" width="30" height="75" fill="#5A4038" />
      </g>
    
      <!-- Nose tip -->
      <ellipse cx="256" cy="264" rx="12" ry="18" fill="url(#paw-grad)" />
      <path d="M 256,246 C 268,246 268,264 268,264 C 268,282 256,282 256,282 Z" fill="#B48D79" />
    
      <!-- Nostrils and mouth -->
      <path d="M 256,270 C 261,270 267,273 266,279 C 265,283 247,283 246,279 C 245,273 251,270 256,270 Z" fill="url(#nose-grad)" />
    </g>
    
    <!-- Network tunneling data stream (dynamic line at bottom) -->
    <g id="data-stream">
      <!-- Main glowing line -->
      <line x1="50" y1="410" x2="462" y2="410" stroke="url(#data-line)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <!-- Bright white core light inside tunnel -->
      <line x1="80" y1="410" x2="430" y2="410" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" stroke-dasharray="20 40"/>
      
      <!-- Center "data packet" glowing node (tunnel penetration feel) -->
      <circle cx="256" cy="410" r="12" fill="#50E3C2" opacity="0.3"/>
      <circle cx="256" cy="410" r="5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
