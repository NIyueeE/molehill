# Complete server configuration example.
# Every option is documented in docs/configuration.md.

[server]
bind_addr = "0.0.0.0:2333" # Necessary. The address that the server listens for clients
default_token = "default_token_if_not_specify" # Optional. Default token for services without their own
heartbeat_interval = 30 # Optional. The interval between two application-layer heartbeats; set to 0 to disable. Default: 30 seconds

[server.transport] # Optional. The whole block is optional
type = "tcp" # Optional. Possible values: ["tcp", "tls", "noise", "websocket"]. Default: "tcp"

[server.transport.tcp] # Same as the client side
nodelay = true # Optional. TCP_NODELAY. Default: true
keepalive_secs = 20 # Optional. `tcp_keepalive_time` in `tcp(7)`. Default: 20 seconds
keepalive_interval = 8 # Optional. `tcp_keepalive_intvl` in `tcp(7)`. Default: 8 seconds

[server.transport.tls] # Necessary only if `type` is "tls"
pkcs12 = "identity.pfx" # The pkcs12 file containing the server certificate and private key
pkcs12_password = "password" # The password of the pkcs12 file

[server.transport.noise] # Necessary only if `type` is "noise". See docs/transport.md
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s" # Optional. Default value as shown
local_private_key = "key_encoded_in_base64" # Optional
remote_public_key = "key_encoded_in_base64" # Optional
psk = "key_encoded_in_base64" # Optional. Pre-shared key (32 bytes, base64-encoded); the pattern must include a PSK modifier (e.g. Noise_KKpsk0_...)
psk_location = 0 # Optional. The PSK slot index used in the pattern. Default: 0

[server.transport.websocket] # Necessary only if `type` is "websocket"
tls = true # Necessary. Enable TLS on the WebSocket connection (uses `server.transport.tls`); set to false for plain WebSocket

[server.services.ssh] # The service name must match the client side
type = "tcp" # Optional. Possible values: ["tcp", "udp"]. Default: "tcp"
token = "whatever" # Necessary if `server.default_token` is not set
bind_addr = "0.0.0.0:5202" # Necessary. The address the service is exposed at
nodelay = true # Optional. Override `server.transport.nodelay` per service

[server.services.dns] # A UDP service example
type = "udp"
bind_addr = "0.0.0.0:53"
